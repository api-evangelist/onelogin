aid: onelogin
name: OneLogin
description: >-
  OneLogin is an identity and access management platform providing single sign-on (SSO), multi-factor authentication,
  user provisioning, and a RESTful API for managing users, roles, applications, MFA, branding, connectors, reports, SAML
  assertions, smart hooks, and Vigilance AI.
